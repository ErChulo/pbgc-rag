name: Verify synthetic offline build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned development browser tooling
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pbgc-verification" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/pbgc-verification/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pbgc-verification/node_modules" >> "$GITHUB_ENV"
          CHROMIUM_PATH="$(NODE_PATH="$RUNNER_TEMP/pbgc-verification/node_modules" node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
      - name: Verify source and supplementary HTTP browser workflow
        run: node tools/verify-browser.js
      - name: Verify actual file browser workflow
        if: ${{ !cancelled() }}
        run: node tools/verify-browser.js --file
      - name: Annotate failed synthetic checks
        if: ${{ failure() }}
        run: node tools/ci-summary.js
      - name: Package synthetic source build
        if: ${{ success() }}
        run: python tools/package.py --out dist/PBGC-RAG-ci.zip
      - name: Upload scoped development evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: synthetic-verification-evidence-${{ matrix.os }}
          path: |
            test-results/verification-*.log
            test-results/verification-*.json
            dist/PBGC-RAG-ci.zip
          if-no-files-found: warn
          retention-days: 7
