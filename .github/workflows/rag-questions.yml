name: Verify separate question answers

on:
  push:
    branches: ['codex/rag-guided-questions-0.9']
  workflow_dispatch:

# This branch check never creates a tag, release or public package.
permissions:
  contents: read

concurrency:
  group: rag-questions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prior-evidence:
    if: github.ref == 'refs/heads/codex/rag-guided-questions-0.9'
    name: Read prior synthetic question evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Download the failed synthetic check evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42502105692 --repo ErChulo/pbgc-rag --name separate-question-evidence-ubuntu-latest --dir prior-evidence
      - name: Expose bounded prior question diagnostics
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const {extractFailureNames,workflowEscape}=require('./tools/ci-summary.js');
          const base=path.resolve('prior-evidence');
          const read=name=>{const file=path.join(base,name);if(!fs.existsSync(file))return null;const stat=fs.lstatSync(file);if(!stat.isFile()||stat.isSymbolicLink()||stat.size>1024*1024)return null;return fs.readFileSync(file,'utf8');};
          const clip=(value,length=180)=>typeof value==='string'?value.slice(0,length):null;
          const log=read('rag-questions-browser-file.log');
          for(const name of extractFailureNames(log||'').slice(0,12))console.log('::notice title=Prior failed synthetic check::'+workflowEscape(name));
          // Only the known synthetic passage-flow test is inspected. Publish
          // primitive assertions and test locations, never captured case text.
          const lines=(log||'').replace(/\x1b\[[0-9;]*m/g,'').split(/\r?\n/),assertions=[];
          for(let index=0;index<lines.length;index++){
            if(!/^(?:not ok\s+\d+\s*-\s*|✖\s+).*REAL learned retrieval keeps separate questions, sources and evidence together/.test(lines[index]))continue;
            const details={locations:[],message:[],primitives:[]};
            for(let next=index+1;next<Math.min(lines.length,index+90);next++){
              const line=lines[next].trim();
              if(/^(?:# Subtest:|not ok\s+\d+|ok\s+\d+|✔\s+|✖\s+)/.test(line))break;
              for(const location of line.match(/rag-questions-browser\.test\.js:\d+:\d+/g)||[])if(!details.locations.includes(location))details.locations.push(location);
              if(/^(?:expected|actual):\s*(?:true|false|null|undefined|-?\d+(?:\.\d+)?)\s*$/.test(line)||/^(?:operator|code):\s*['"]?[A-Za-z_]+['"]?\s*$/.test(line))details.primitives.push(line.slice(0,100));
              if(/^(?:Expected values to be strictly equal:|The expression evaluated to a falsy value:|assert\.(?:equal|ok|match|deepEqual)\(.{0,180}\))$/.test(line)&&!/prompt|source|raw/i.test(line))details.message.push(line.slice(0,180));
              const timeout=/(?:page|locator)\.[A-Za-z]+:\s*Timeout\s+(\d+)ms exceeded/.exec(line);
              if(timeout)details.message.push('Browser action timed out after '+timeout[1]+' ms.');
            }
            if(details.locations.length||details.message.length||details.primitives.length)assertions.push(details);
          }
          if(assertions.length)console.log('::notice title=Prior synthetic passage-flow assertion::'+workflowEscape(JSON.stringify(assertions.slice(0,2)).slice(0,1200)));
          const raw=read('rag-questions-real-file.json')||read('rag-questions-real.json');
          if(raw){
            const report=JSON.parse(raw),safe={run:42502105692,batchStatus:clip(report.batchStatus),batchError:report.batchError?{name:clip(report.batchError.errorName,100),message:clip(report.batchError.errorMessage)}:null,ragStatus:clip(report.ragStatus),questions:(report.questions||[]).slice(0,3).map(row=>({index:row.index,status:clip(row.status,30),reason:clip(row.reason,100)})),calls:(report.modelOutputs||[]).slice(0,3).map(call=>({state:clip(call.state,30),elapsedMs:Number.isFinite(call.elapsedMs)?call.elapsedMs:null,errorName:clip(call.errorName,100),errorMessage:clip(call.errorMessage,100)})),externalRequests:Number.isFinite(report.externalRequests)?report.externalRequests:null};
            console.log('::notice title=Prior synthetic question model diagnostics::'+workflowEscape(JSON.stringify(safe)));
          }else console.log('::warning title=Prior synthetic question diagnostics::No bounded real-model report was available.');
          JS
  office-questions:
    if: github.ref == 'refs/heads/codex/rag-guided-questions-0.9'
    name: packaged questions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned development browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/pbgc-questions" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/pbgc-questions/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pbgc-questions/node_modules" >> "$GITHUB_ENV"
          CHROMIUM_PATH="$(NODE_PATH="$RUNNER_TEMP/pbgc-questions/node_modules" node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
      - name: Check the model profile and prepare its exact local weights
        run: |
          python tools/build-model-profile.py --check
          python tools/prepare-models.py
      - name: Build and verify the complete local office ZIP
        run: |
          mkdir -p test-results
          python tools/package.py --office | tee test-results/rag-questions-package.json
      - name: Verify the same ZIP offline with real Qwen, OCR and original-page reading
        env:
          PBGC_REQUIRE_OFFICE: '1'
          PBGC_OFFICE_FILE: '1'
        run: node tests/office-package.test.js 2>&1 | tee test-results/rag-questions-office-file.log
      - name: Extract the checked ZIP to a path with spaces
        run: |
          python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          source = Path('dist/PBGC-RAG-0.8-larger-model-office.zip')
          destination = Path(os.environ['RUNNER_TEMP']) / 'RAG questions office app with spaces'
          with zipfile.ZipFile(source) as package:
              for entry in package.infolist():
                  path = PurePosixPath(entry.filename)
                  if (path.is_absolute() or '..' in path.parts or '\\' in entry.filename
                          or ':' in entry.filename or stat.S_ISLNK(entry.external_attr >> 16)):
                      raise SystemExit('Unsafe office ZIP path')
              if package.testzip() is not None:
                  raise SystemExit('Office ZIP CRC validation failed')
              package.extractall(destination)
          if not (destination / 'assets/rag-questions.js').is_file():
              raise SystemExit('The office ZIP lacks the new question orchestration asset')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('PBGC_QUESTIONS_ROOT=' + str(destination.resolve()) + '\n')
          PY
      - name: Check separate source-bound answers in the extracted office app
        id: questions
        env:
          PBGC_REQUIRE_BATCH_MODEL: '1'
        run: node tests/rag-questions-browser.test.js 2>&1 | tee test-results/rag-questions-browser-file.log
      - name: Expose bounded failed question diagnostics
        if: ${{ failure() && steps.questions.outcome == 'failure' }}
        run: |
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const {extractFailureNames,workflowEscape}=require('./tools/ci-summary.js');
          const base=path.resolve('test-results');
          const read=name=>{const file=path.join(base,name);if(!fs.existsSync(file))return null;const stat=fs.lstatSync(file);if(!stat.isFile()||stat.isSymbolicLink()||stat.size>1024*1024)return null;return fs.readFileSync(file,'utf8');};
          const clip=(value,length=180)=>typeof value==='string'?value.slice(0,length):null;
          const names=extractFailureNames(read('rag-questions-browser-file.log')||'');
          if(!names.length)names.push('Question browser acceptance failed before a named test result was available.');
          for(const name of names.slice(0,12))console.log('::error title=Failed synthetic question check::'+workflowEscape(name));
          const raw=read('rag-questions-real-file.json')||read('rag-questions-real.json');
          if(raw){
            const report=JSON.parse(raw),safe={batchStatus:clip(report.batchStatus),batchError:report.batchError?{name:clip(report.batchError.errorName,100),message:clip(report.batchError.errorMessage)}:null,ragStatus:clip(report.ragStatus),questions:(report.questions||[]).slice(0,3).map(row=>({index:row.index,status:clip(row.status,30),reason:clip(row.reason,100)})),calls:(report.modelOutputs||[]).slice(0,3).map(call=>({state:clip(call.state,30),elapsedMs:Number.isFinite(call.elapsedMs)?call.elapsedMs:null,errorName:clip(call.errorName,100),errorMessage:clip(call.errorMessage,100)})),externalRequests:Number.isFinite(report.externalRequests)?report.externalRequests:null};
            console.log('::notice title=Synthetic question model diagnostics::'+workflowEscape(JSON.stringify(safe)));
          }else console.log('::warning title=Synthetic question diagnostics::No bounded real-model report was available.');
          JS
      - name: Upload scoped question and package evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: separate-question-evidence-${{ matrix.os }}
          path: |
            test-results/rag-questions*.log
            test-results/rag-questions*.json
            test-results/rag-questions*.png
            test-results/office-resources-file.json
            test-results/office-package-file.png
            test-results/office-original-page-file.png
          if-no-files-found: warn
          retention-days: 7
